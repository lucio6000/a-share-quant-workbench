services:
  - type: web
    name: a-share-quant-workbench
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATA_MODE
        value: demo
      - key: IFIND_REFRESH_TOKEN
        sync: false
